name: CI

# Documentation-only changes skip this job entirely. Nothing below reads a
# Markdown file -- lint, typecheck, prisma validate and the unit suite all
# operate on TypeScript and the schema -- so a docs edit spends several
# minutes of CI to re-prove something it cannot have broken.
#
# `paths-ignore` skips the workflow rather than passing it, so the run does
# not appear at all on a docs-only PR. That is fine today because `main` has
# no branch protection. If a required status check is ever added for this
# job, a skipped run never reports and would block such a PR forever -- at
# that point this needs to become a job that runs and exits early, not a
# workflow that does not start.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    # No Postgres or Redis here, deliberately. Nothing in the current suite
    # opens a connection, so a database in CI would be weight for nothing.
    # The values below only satisfy the boot-time validation in
    # src/common/env.validation.ts, which requires the variables to be present.
    # Docker Postgres and Redis stay a local concern; see docker-compose.yml.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://huddle:huddle@localhost:5432/huddle
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # lint:ci is eslint without --fix. `npm run lint` repairs what it can,
      # which would let a fixable violation pass here unnoticed.
      - run: npm run lint:ci

      - run: npm run typecheck

      # Catches a malformed schema without needing a server. Applying the
      # migrations themselves is deliberately not done here: that is the step
      # that would drag a Postgres service container into this job, and
      # migrations stay a local and deploy-time concern. `npm run db:migrate`
      # locally, `npm run db:migrate:deploy` on a real deployment.
      - run: npx prisma validate --config apps/api/prisma.config.ts

      - run: npm test

      # No `npm run test:e2e` or `npm run test:integration` here. Both need a
      # real Postgres -- e2e boots the whole application, and the integration
      # suite asserts constraints against the huddle_test database -- and this
      # job deliberately runs without one. Run them locally against Docker:
      # `npm run db:up && npm run test:integration && npm run test:e2e`.
