name: huddle

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: huddle
      POSTGRES_PASSWORD: huddle
      POSTGRES_DB: huddle
    ports:
      - "5432:5432"
    # Keep the footprint small; this is a laptop, not a production box.
    command: postgres -c shared_buffers=128MB -c max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the data volume is empty. See docker/init.sql.
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huddle -d huddle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    # Persistence off, deliberately. Everything Redis holds here is ephemeral:
    # sessions, rate-limit buckets, the presence registry, and 30-second
    # idempotency keys. See docs/architecture/data-model.md section 1.
    # Nothing in this project may depend on a Redis key surviving a restart.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
